name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    # R-R6-06: release builds are slow; fail the job instead of hanging the runner.
    # Two SignPath requests require maintainer approval. GitHub's job limit is 6h.
    timeout-minutes: 360
    env:
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
      SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # A green PR run is not a release gate: the commit must already be on main.
      - name: require the tagged commit to be on main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $state = (& gh api "repos/$env:GITHUB_REPOSITORY/compare/main...$env:GITHUB_SHA" --jq '.status').Trim()
          if ($state -notin @('behind', 'identical')) {
            throw "Tagged commit $env:GITHUB_SHA is not on main (compare status: $state)."
          }

      # R-R6-07: v1.3.0 and v1.3.1 were published with no Release run at all, because
      # both workflows were disabled remotely and nothing in the pipeline could see it.
      # A tag push is the last moment anyone is looking, so the release refuses to
      # spend a runner until CI has actually passed on this exact commit. A missing
      # run (CI disabled, or the tag points at a commit that never reached main) fails
      # here too — "no evidence" is not "green".
      - name: require a green CI run on this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WAIT_MINUTES: "45"
        run: |
          $sha = $env:GITHUB_SHA
          $waitMin = [int]$env:CI_WAIT_MINUTES
          $deadline = (Get-Date).AddMinutes($waitMin)
          function Get-CiState {
            & gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=20" `
              --jq '[.workflow_runs[] | select(.event=="push")] as $runs | if ($runs | length) == 0 then "NONE" else ($runs | max_by(.run_number) | "\(.run_number)|\(.status)|\(.conclusion)") end'
          }
          $state = (Get-CiState).Trim()
          # A tag can beat CI run registration by a few seconds. Retry briefly,
          # but keep treating a persistent missing run as "no evidence".
          $registrationDeadline = (Get-Date).AddMinutes(2)
          while ($state -eq 'NONE' -or -not $state) {
            if ((Get-Date) -gt $registrationDeadline) {
              throw "No CI run exists for commit $sha. Push the commit to main, let CI finish, then tag."
            }
            Start-Sleep -Seconds 10
            $state = (Get-CiState).Trim()
          }
          $parts = $state.Split('|')
          Write-Host "CI run #$($parts[0]) status=$($parts[1]) conclusion=$($parts[2])"
          while ($parts[1] -ne 'completed') {
            if ((Get-Date) -gt $deadline) {
              throw "CI run #$($parts[0]) is still '$($parts[1])' after $waitMin minutes; refusing to release an unverified tree."
            }
            Start-Sleep -Seconds 30
            $state = (Get-CiState).Trim()
            if ($state -eq 'NONE' -or -not $state) { throw "CI run for $sha disappeared." }
            $parts = $state.Split('|')
            Write-Host "CI run #$($parts[0]) status=$($parts[1]) conclusion=$($parts[2])"
          }
          if ($parts[2] -ne 'success') {
            throw "CI run #$($parts[0]) concluded '$($parts[2])' for $sha. Fix CI before tagging a release."
          }
          # The aggregate conclusion can be green while a required job was
          # skipped. Assert the two release-critical jobs individually.
          $runId = (& gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=20" `
            --jq '[.workflow_runs[] | select(.event=="push")] | max_by(.run_number) | .id').Trim()
          $jobs = (& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/jobs" `
            --jq '[.jobs[] | {name, conclusion}]') | ConvertFrom-Json
          foreach ($required in @('test', 'package')) {
            $job = $jobs | Where-Object { $_.name -eq $required } | Select-Object -First 1
            if (-not $job) {
              throw "CI run $runId has no '$required' job for $sha; refusing to release."
            }
            if ($job.conclusion -ne 'success') {
              throw "CI job '$required' concluded '$($job.conclusion)' for $sha; refusing to release."
            }
          }
          Write-Host "CI is green for $sha (test + package)."

      - name: validate release mode and signing configuration
        id: signing-config
        shell: pwsh
        run: pwsh -NoProfile -File scripts/prepare-signed-release.ps1
        env:
          # 1.3.2 is published unsigned/manual by maintainer decision. The
          # exception is tag-scoped: every later release needs an explicit
          # repository variable instead of inheriting a blanket bypass.
          ALLOW_UNSIGNED_RELEASE: ${{ github.ref_name == 'v1.3.2' && 'true' || vars.ALLOW_UNSIGNED_RELEASE }}
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
          SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: refuse to replace a published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" 2>&1
          if ($LASTEXITCODE -eq 0) {
            if (-not (($existing | Out-String | ConvertFrom-Json).draft)) { throw 'This tag already has a published release.' }
          } elseif (($existing | Out-String) -notmatch 'HTTP 404') {
            throw 'Could not determine existing release state.'
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.8.0
        with:
          workspaces: src-tauri
          # Release build artifacts are large; cache registry/git deps only via default key.
          cache-targets: "false"

      - name: npm ci
        run: npm ci

      - name: check versions vs tag
        run: npm run check-versions
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: check commands
        run: npm run check-commands

      - name: release signing policy regression
        run: pwsh -NoProfile -File scripts/test-release-signing-policy.ps1

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy (lib + tests)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test (lib + bins)
        run: cargo test --workspace
        working-directory: src-tauri

      - name: file symlink swap regression (requires runner privilege)
        shell: pwsh
        run: |
          $out = cargo test fsutil::tests::copy_dir_refuses_file_swapped_to_symlink_after_enumeration -- --ignored --exact 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0 -or -not ($out | Select-String -SimpleMatch "1 passed")) { exit 1 }
        working-directory: src-tauri

      - name: privileged seal key ACL and lost-state regression
        shell: pwsh
        run: |
          $out = cargo test path_seal::key::tests::privileged_key_store_acl_and_missing_state_regression -- --ignored --exact 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0 -or -not ($out | Select-String -SimpleMatch "1 passed")) { exit 1 }
        working-directory: src-tauri

      - name: frontend lint
        run: npm run lint

      # R21-QA-04: release path must honor the coverage gate, not bare vitest.
      - name: frontend test + coverage gate
        run: npm run coverage

      # R21-QA-09: tauri build runs beforeBuildCommand (npm run build) itself.
      - name: build app before signing
        run: npx tauri build --no-bundle --config .release-signing/tauri.release.json -- --locked

      - name: read application signing metadata
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        id: app-metadata
        shell: pwsh
        run: pwsh -NoProfile -File scripts/read-signing-metadata.ps1 -Path src-tauri/target/release/remova.exe

      - name: upload unsigned application
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Remova-unsigned-application
          path: src-tauri/target/release/remova.exe
          if-no-files-found: error

      - name: sign application (maintainer approval required)
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        uses: signpath/github-action-submit-signing-request@4184a38a17e5b37d026a3ed443581c1f03ae1b3a # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: application
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: .release-signing/application
          parameters: |
            product-version: ${{ toJSON(steps.app-metadata.outputs.product-version) }}
            file-version: ${{ toJSON(steps.app-metadata.outputs.file-version) }}

      - name: verify and stage signed application
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        shell: pwsh
        run: |
          & scripts/verify-authenticode.ps1 -Paths @('.release-signing/application/remova.exe')
          Copy-Item -LiteralPath .release-signing/application/remova.exe -Destination src-tauri/target/release/remova.exe -Force

      - name: bundle final application
        # Sign final installer bytes later, after optional SignPath signing.
        run: npx tauri bundle --config .release-signing/tauri.release.json

      - name: read installer signing metadata
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        id: installer-metadata
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($nsis.Count -ne 1) { throw 'Expected one NSIS installer.' }
          & scripts/read-signing-metadata.ps1 -Path $nsis[0].FullName -Prefix 'nsis-'

      - name: upload unsigned installers
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        id: unsigned-installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Remova-unsigned-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: sign installers (maintainer approval required)
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        uses: signpath/github-action-submit-signing-request@4184a38a17e5b37d026a3ed443581c1f03ae1b3a # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: .release-signing/installers
          parameters: |
            nsis-product-version: ${{ toJSON(steps.installer-metadata.outputs.nsis-product-version) }}
            nsis-file-version: ${{ toJSON(steps.installer-metadata.outputs.nsis-file-version) }}

      - name: stage final signed installers
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        shell: pwsh
        run: |
          foreach ($kind in @('nsis', 'msi')) {
            $extension = if ($kind -eq 'nsis') { '*.exe' } else { '*.msi' }
            $files = @(Get-ChildItem -LiteralPath ".release-signing/installers/$kind" -Filter $extension)
            if ($files.Count -ne 1) { throw "Expected one signed $kind installer." }
            & scripts/verify-authenticode.ps1 -Paths @($files[0].FullName)
            Copy-Item -LiteralPath $files[0].FullName -Destination "src-tauri/target/release/bundle/$kind/" -Force
          }

      - name: sign and verify final updater artifacts
        shell: pwsh
        run: pwsh -NoProfile -File scripts/finalize-signed-release.ps1
        env:
          SIGNPATH_ENABLED: ${{ steps.signing-config.outputs.signpath-enabled }}
          # Empty in the unsigned/manual mode, which publishes installers and
          # checksums only; the script omits updater assets instead of failing.
          UPDATER_SIGNING_ENABLED: ${{ steps.signing-config.outputs.updater-enabled }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: frontend dist smoke
        run: npm run smoke:dist

      # R23-QA-06: launch smoke needs WebView2 on the runner, and the release
      # path honors the same smoke depth as the ci package job.
      - name: install WebView2 (launch smoke prerequisite)
        shell: pwsh
        run: |
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          $installed = $keys | ForEach-Object { (Get-ItemProperty -ErrorAction SilentlyContinue $_).pv } | Where-Object { $_ }
          if ($installed) {
            Write-Host "WebView2 already installed: @($installed)[0]"
          } else {
            $dl = "$env:RUNNER_TEMP\webview2.exe"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $dl
            $p = Start-Process -FilePath $dl -Args "/silent /install" -PassThru -Wait
            if ($p.ExitCode -notin 0, 3010) {
              Write-Error "WebView2 installer exit code $($p.ExitCode)"
              exit $p.ExitCode
            }
            Write-Host "WebView2 installed (exit $($p.ExitCode))"
          }

      - name: app launch smoke
        shell: pwsh
        run: npm run smoke:launch

      - name: app binary smoke
        shell: pwsh
        run: npm run smoke:app

      - name: package portable zip
        shell: pwsh
        run: npm run package:portable

      - name: portable zip smoke
        shell: pwsh
        run: npm run smoke:portable

      - name: upload NSIS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Remova-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: upload MSI installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Remova-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # docs/ is no longer committed, so a curated per-release notes file cannot reach the runner.
      # The tag's own CHANGELOG section is the published text; a missing section fails the job here
      # instead of silently falling back to GitHub auto notes (which read like a raw commit list).
      - name: build Release body from CHANGELOG
        shell: pwsh
        run: pwsh -NoProfile -File scripts/extract-release-notes.ps1

      - name: generate artifact checksums
        shell: pwsh
        run: pwsh -NoProfile -File scripts/make-checksums.ps1

      - name: create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.1
        with:
          # Updater assets exist only in updater-signing mode. The `.sig` and
          # `latest.json` globs are omitted in the unsigned/manual mode so
          # `fail_on_unmatched_files` does not reject a valid installer-only
          # release (the mode is decided by prepare-signed-release.ps1).
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/portable/*.zip
            ${{ steps.signing-config.outputs.updater-enabled == 'true' && 'src-tauri/target/release/bundle/nsis/*.sig' || '' }}
            ${{ steps.signing-config.outputs.updater-enabled == 'true' && 'src-tauri/target/release/bundle/msi/*.sig' || '' }}
            ${{ steps.signing-config.outputs.updater-enabled == 'true' && 'src-tauri/target/release/bundle/latest.json' || '' }}
            src-tauri/target/release/bundle/SHA256SUMS.txt
          body_path: .release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          # a renamed/moved bundle must fail the job, not publish an asset-less Release.
          fail_on_unmatched_files: true
          draft: true

      - name: publish complete verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the completed draft.' }
