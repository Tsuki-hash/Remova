name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    # Release builds are slow; fail the job instead of hanging the runner.
    # Two SignPath requests require maintainer approval. GitHub's job limit is 6h.
    timeout-minutes: 360
    env:
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
      SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: require successful main CI for the tagged commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File scripts/require-release-ci.ps1 -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA -WaitMinutes 45

      - name: validate release mode and signing configuration
        id: signing-config
        shell: pwsh
        run: pwsh -NoProfile -File scripts/prepare-signed-release.ps1
        env:
          # 1.4.0 is published unsigned/manual by maintainer decision. The
          # exception is tag-scoped: every later release needs an explicit
          # repository variable instead of inheriting a blanket bypass.
          ALLOW_UNSIGNED_RELEASE: ${{ github.ref_name == 'v1.4.0' && 'true' || vars.ALLOW_UNSIGNED_RELEASE }}
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
          SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          # Explicit security-mode switch: configured keys alone must not
          # re-enable the updater path after an advisory.
          UPDATER_ENABLED: ${{ vars.UPDATER_ENABLED }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: refuse to replace a published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" 2>&1
          if ($LASTEXITCODE -eq 0) {
            if (-not (($existing | Out-String | ConvertFrom-Json).draft)) { throw 'This tag already has a published release.' }
          } elseif (($existing | Out-String) -notmatch '404') {
            # gh renders a not-found either as "gh: ... (HTTP 404)" or as the
            # JSON body alone ('"status":"404"'); both must count as "no release".
            throw "Could not determine existing release state: $($existing | Out-String)"
          }
          # The pwsh shell wrapper exits with $LASTEXITCODE; a not-found probe
          # must not leak gh's exit 1 into a step failure after the checks pass.
          exit 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install pinned Rust and verify Windows build tools
        shell: pwsh
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup component add rustfmt clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/check-windows-build-tools.ps1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # Release build artifacts are large; cache registry/git deps only via default key.
          cache-targets: "false"

      - name: npm ci
        run: npm ci

      - name: check versions vs tag
        run: npm run check-versions
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: check commands
        run: npm run check-commands

      - name: release signing policy regression
        run: pwsh -NoProfile -File scripts/test-release-signing-policy.ps1

      - name: lockfile completeness (cargo fetch --locked)
        run: cargo fetch --locked
        working-directory: src-tauri

      - name: verify distribution license notices
        run: node scripts/make-sbom.mjs --check-notices

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy (lib + tests)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test (lib + bins)
        run: cargo test --workspace
        working-directory: src-tauri

      - name: file symlink swap regression (requires runner privilege)
        shell: pwsh
        run: |
          $out = cargo test fsutil::tests::copy_dir_refuses_file_swapped_to_symlink_after_enumeration -- --ignored --exact 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0 -or -not ($out | Select-String -SimpleMatch "1 passed")) { exit 1 }
        working-directory: src-tauri

      - name: privileged seal key ACL and lost-state regression
        shell: pwsh
        run: |
          $out = cargo test path_seal::key::tests::privileged_key_store_acl_and_missing_state_regression -- --ignored --exact 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0 -or -not ($out | Select-String -SimpleMatch "1 passed")) { exit 1 }
        working-directory: src-tauri

      - name: frontend lint
        run: npm run lint

      # The release path must honor the coverage gate, not bare vitest.
      - name: frontend test + coverage gate
        run: npm run coverage

      # The tauri build runs beforeBuildCommand (npm run build) itself.
      - name: build app before signing
        run: npx tauri build --no-bundle --config .release-signing/tauri.release.json -- --locked

      - name: read application signing metadata
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        id: app-metadata
        shell: pwsh
        run: pwsh -NoProfile -File scripts/read-signing-metadata.ps1 -Path src-tauri/target/release/remova.exe

      - name: prepare application signing inputs for each distribution channel
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        run: node scripts/prepare-application-signing.mjs src-tauri/target/release/remova.exe .release-signing/unsigned-application

      - name: upload unsigned application
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Remova-unsigned-application
          path: .release-signing/unsigned-application/
          include-hidden-files: true
          if-no-files-found: error

      - name: sign application (maintainer approval required)
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        uses: signpath/github-action-submit-signing-request@4184a38a17e5b37d026a3ed443581c1f03ae1b3a # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: application
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: .release-signing/application
          parameters: |
            product-version: ${{ toJSON(steps.app-metadata.outputs.product-version) }}
            file-version: ${{ toJSON(steps.app-metadata.outputs.file-version) }}

      - name: bundle channel-specific signed applications
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        shell: pwsh
        run: |
          $signed = '.release-signing/application'
          & scripts/verify-authenticode.ps1 -Paths @('portable', 'msi', 'nsis' | ForEach-Object { "$signed/$_/remova.exe" })
          $application = 'src-tauri/target/release/remova.exe'
          try {
            foreach ($channel in @('msi', 'nsis')) {
              Copy-Item -LiteralPath "$signed/$channel/remova.exe" -Destination $application -Force
              npx tauri bundle --bundles $channel --no-sign --no-binary-patching --ci --config .release-signing/tauri.release.json
              if ($LASTEXITCODE -ne 0) { throw "Could not bundle the signed $channel application." }
            }
          } finally {
            Copy-Item -LiteralPath "$signed/portable/remova.exe" -Destination $application -Force
          }

      - name: bundle final application
        if: steps.signing-config.outputs.signpath-enabled != 'true'
        # Sign final installer bytes later, after optional SignPath signing.
        run: npx tauri bundle --config .release-signing/tauri.release.json

      - name: read installer signing metadata
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        id: installer-metadata
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($nsis.Count -ne 1) { throw 'Expected one NSIS installer.' }
          & scripts/read-signing-metadata.ps1 -Path $nsis[0].FullName -Prefix 'nsis-'

      - name: upload unsigned installers
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        id: unsigned-installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Remova-unsigned-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: sign installers (maintainer approval required)
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        uses: signpath/github-action-submit-signing-request@4184a38a17e5b37d026a3ed443581c1f03ae1b3a # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: .release-signing/installers
          parameters: |
            nsis-product-version: ${{ toJSON(steps.installer-metadata.outputs.nsis-product-version) }}
            nsis-file-version: ${{ toJSON(steps.installer-metadata.outputs.nsis-file-version) }}

      - name: stage final signed installers
        if: steps.signing-config.outputs.signpath-enabled == 'true'
        shell: pwsh
        run: |
          foreach ($kind in @('nsis', 'msi')) {
            $extension = if ($kind -eq 'nsis') { '*.exe' } else { '*.msi' }
            $files = @(Get-ChildItem -LiteralPath ".release-signing/installers/$kind" -Filter $extension)
            if ($files.Count -ne 1) { throw "Expected one signed $kind installer." }
            & scripts/verify-authenticode.ps1 -Paths @($files[0].FullName)
            Copy-Item -LiteralPath $files[0].FullName -Destination "src-tauri/target/release/bundle/$kind/" -Force
          }

      - name: sign and verify final updater artifacts
        shell: pwsh
        run: pwsh -NoProfile -File scripts/finalize-signed-release.ps1
        env:
          SIGNPATH_ENABLED: ${{ steps.signing-config.outputs.signpath-enabled }}
          # Empty in the unsigned/manual mode, which publishes installers and
          # checksums only; the script omits updater assets instead of failing.
          UPDATER_SIGNING_ENABLED: ${{ steps.signing-config.outputs.updater-enabled }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: frontend dist smoke
        run: npm run smoke:dist

      # Launch smoke needs WebView2 on the runner, and the release
      # path honors the same smoke depth as the ci package job.
      - name: install WebView2 (launch smoke prerequisite)
        shell: pwsh
        run: |
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          $installed = $keys | ForEach-Object { (Get-ItemProperty -ErrorAction SilentlyContinue $_).pv } | Where-Object { $_ }
          if ($installed) {
            Write-Host "WebView2 already installed: @($installed)[0]"
          } else {
            $dl = "$env:RUNNER_TEMP\webview2.exe"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $dl
            # The fwlink target is not pinned, so the downloaded binary has to
            # prove itself before anything executes it: a valid Authenticode
            # signature from Microsoft, or the job fails here.
            $sig = Get-AuthenticodeSignature -FilePath $dl
            if ($sig.Status -ne 'Valid') { throw "WebView2 installer signature: $($sig.Status)" }
            if ($null -eq $sig.SignerCertificate -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
              throw "WebView2 installer signer is not Microsoft: $($sig.SignerCertificate.Subject)"
            }
            $p = Start-Process -FilePath $dl -Args "/silent /install" -PassThru -Wait
            if ($p.ExitCode -notin 0, 3010) {
              Write-Error "WebView2 installer exit code $($p.ExitCode)"
              exit $p.ExitCode
            }
            Write-Host "WebView2 installed (exit $($p.ExitCode))"
          }

      - name: app launch smoke
        shell: pwsh
        run: npm run smoke:launch

      - name: app binary smoke
        shell: pwsh
        run: npm run smoke:app

      - name: package portable zip
        shell: pwsh
        run: npm run package:portable

      - name: portable zip smoke
        shell: pwsh
        run: npm run smoke:portable

      # docs/ is no longer committed, so a curated per-release notes file cannot reach the runner.
      # The tag's own CHANGELOG section is the published text; a missing section fails the job here
      # instead of silently falling back to GitHub auto notes (which read like a raw commit list).
      - name: build Release body from CHANGELOG
        shell: pwsh
        env:
          SIGNPATH_ENABLED: ${{ steps.signing-config.outputs.signpath-enabled }}
        run: |
          if ($env:SIGNPATH_ENABLED -cnotin @('true', 'false')) { throw 'Unknown installer signing mode.' }
          & scripts/extract-release-notes.ps1 -CheckDownloadNotes -Unsigned:($env:SIGNPATH_ENABLED -cne 'true')

      - name: generate artifact checksums
        shell: pwsh
        run: pwsh -NoProfile -File scripts/make-checksums.ps1

      - name: verify packaged executables and licenses
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ steps.signing-config.outputs.version }}
          SIGNPATH_ENABLED: ${{ steps.signing-config.outputs.signpath-enabled }}
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          $flat = (New-Item -ItemType Directory -Path '.release-signing/packaged').FullName
          Copy-Item -Path "$bundle/nsis/*-setup.exe", "$bundle/msi/*.msi", "$bundle/portable/*.zip", "$bundle/SHA256SUMS.txt" -Destination $flat
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe' }
          $wixDark = Join-Path $env:LOCALAPPDATA 'tauri/WixTools314/dark.exe'
          $reference = & scripts/acceptance/get-package-exe-reference.ps1 -Artifacts $flat -CandidateVersion $env:CANDIDATE_VERSION -SevenZip $sevenZip -WixDark $wixDark | ConvertFrom-Json -AsHashtable
          if ($env:SIGNPATH_ENABLED -ceq 'true') {
            foreach ($channel in @('nsis', 'msi', 'portable')) {
              $expected = (Get-FileHash -LiteralPath ".release-signing/application/$channel/remova.exe" -Algorithm SHA256).Hash
              if ($reference[$channel].executable_sha256 -ine $expected) {
                throw "The $channel package does not contain the exact verified signed application."
              }
            }
          }

      - name: generate dependency sbom
        run: node scripts/make-sbom.mjs

      - name: upload NSIS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Remova-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: upload MSI installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Remova-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: stage verified draft inputs
        shell: pwsh
        env:
          UPDATER_ENABLED: ${{ steps.signing-config.outputs.updater-enabled }}
          VERSION: ${{ steps.signing-config.outputs.version }}
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          $handoff = 'release-handoff'
          $assets = New-Item -ItemType Directory -Path "$handoff/assets"
          $inputs = @("nsis/Remova_${env:VERSION}_x64-setup.exe", "msi/Remova_${env:VERSION}_x64_zh-CN.msi", "portable/Remova_${env:VERSION}_x64-portable.zip", 'SHA256SUMS.txt', 'SBOM.cdx.json')
          if ($env:UPDATER_ENABLED -ceq 'true') {
            $inputs += "$($inputs[0]).sig", "$($inputs[1]).sig", 'latest.json'
          }
          foreach ($file in $inputs) {
            Copy-Item -LiteralPath "$bundle/$file" -Destination $assets.FullName
          }
          Copy-Item -LiteralPath ".release-notes/$env:GITHUB_REF_NAME.md" -Destination "$handoff/release-notes.md"
          $hashes = [ordered]@{}
          foreach ($file in (Get-ChildItem -LiteralPath $assets.FullName -File)) {
            $hashes[$file.Name] = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
          }
          [ordered]@{ commit = $env:GITHUB_SHA; tag = $env:GITHUB_REF_NAME; assets = $hashes;
            notes_sha256 = (Get-FileHash -LiteralPath "$handoff/release-notes.md" -Algorithm SHA256).Hash
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath "$handoff/handoff.json" -Encoding utf8

      - name: upload verified draft inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Remova-release-handoff
          path: release-handoff/
          if-no-files-found: error

  draft:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
      actions: read
    steps:
      # This job runs no checkout, package lifecycle hooks or compiler.
      - name: download and verify draft inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name Remova-release-handoff --dir release-handoff
          if ($LASTEXITCODE) { throw 'Could not download the verified release inputs.' }
          $handoff = 'release-handoff'
          $manifest = Get-Content -Raw -LiteralPath "$handoff/handoff.json" | ConvertFrom-Json -AsHashtable
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $manifest.tag -cne $tag -or $manifest.commit -cne $env:GITHUB_SHA) {
            throw 'Draft inputs do not identify the tagged commit.'
          }
          $version = $tag.Substring(1)
          $base = @(
            "Remova_${version}_x64-setup.exe", "Remova_${version}_x64_zh-CN.msi", "Remova_${version}_x64-portable.zip",
            'SHA256SUMS.txt', 'SBOM.cdx.json'
          )
          $expected = if ($manifest.assets.Count -eq 8) { $base + @("$($base[0]).sig", "$($base[1]).sig", 'latest.json') } else { $base }
          $files = @(Get-ChildItem -LiteralPath "$handoff/assets" -Force)
          if ($files.Count -ne $expected.Count -or $manifest.assets.Count -ne $expected.Count) {
            throw 'Unexpected draft attachment count.'
          }
          foreach ($name in $expected) {
            $file = Get-Item -LiteralPath "$handoff/assets/$name"
            if ($file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
                !$manifest.assets.Contains($name) -or (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash -cne $manifest.assets[$name]) {
              throw "Draft attachment identity or checksum mismatch: $name"
            }
          }
          if ((Get-FileHash -LiteralPath "$handoff/release-notes.md" -Algorithm SHA256).Hash -cne $manifest.notes_sha256) {
            throw 'Draft release notes checksum mismatch.'
          }
          $taggedCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq '.sha'
          if ($LASTEXITCODE -or $taggedCommit -cne $env:GITHUB_SHA) { throw 'The release tag moved during verification.' }
          $existing = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>&1
          if ($LASTEXITCODE -eq 0) {
            if (($existing | Out-String | ConvertFrom-Json).draft -ne $true) { throw 'This tag already has a published release.' }
          } elseif (($existing | Out-String) -notmatch '404') {
            throw 'Could not determine the existing release state.'
          }
          exit 0

      - name: create GitHub release draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release-handoff/assets/*
          body_path: release-handoff/release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          draft: true
