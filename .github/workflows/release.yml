name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # R-R6-06: release builds are slow; fail the job instead of hanging the runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Release build artifacts are large; cache registry/git deps only via default key.
          cache-targets: "false"

      - name: npm ci
        run: npm ci

      - name: check versions vs tag
        run: npm run check-versions
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: check commands
        run: npm run check-commands

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy (lib + tests)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test (lib + bins)
        run: cargo test --workspace
        working-directory: src-tauri

      - name: frontend lint
        run: npm run lint

      - name: frontend typecheck tests
        run: npm run typecheck:tests

      - name: frontend tests
        run: npm test

      - name: frontend build
        run: npm run build

      - name: frontend dist smoke
        run: npm run smoke:dist

      - name: tauri build
        run: npx tauri build

      - name: app binary smoke
        shell: pwsh
        run: npm run smoke:app

      - name: package portable zip
        shell: pwsh
        run: npm run package:portable

      - name: portable zip smoke
        shell: pwsh
        run: npm run smoke:portable

      - name: upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Remova-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: Remova-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # docs/ is no longer committed, so a curated per-release notes file cannot reach the runner.
      # The tag's own CHANGELOG section is the published text; a missing section fails the job here
      # instead of silently falling back to GitHub auto notes (which read like a raw commit list).
      - name: build Release body from CHANGELOG
        shell: pwsh
        run: pwsh -NoProfile -File scripts/extract-release-notes.ps1

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/portable/*.zip
          body_path: .release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          # a renamed/moved bundle must fail the job, not publish an asset-less Release.
          fail_on_unmatched_files: true
