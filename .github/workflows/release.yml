name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # R-R6-06: release builds are slow; fail the job instead of hanging the runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Release build artifacts are large; cache registry/git deps only via default key.
          cache-targets: "false"

      - name: npm ci
        run: npm ci

      - name: check versions vs tag
        run: npm run check-versions
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: check commands
        run: npm run check-commands

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy (lib + tests)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test (lib + bins)
        run: cargo test --workspace
        working-directory: src-tauri

      - name: file symlink swap regression (requires runner privilege)
        run: cargo test copy_dir_refuses_file_swapped_to_symlink_after_enumeration -- --ignored
        working-directory: src-tauri

      - name: privileged seal key ACL and lost-state regression
        run: cargo test privileged_key_store_acl_and_missing_state_regression -- --ignored
        working-directory: src-tauri

      - name: frontend lint
        run: npm run lint

      # R21-QA-04: release path must honor the coverage gate, not bare vitest.
      - name: frontend test + coverage gate
        run: npm run coverage

      # R21-QA-09: tauri build runs beforeBuildCommand (npm run build) itself.
      - name: tauri build
        run: npx tauri build

      - name: frontend dist smoke
        run: npm run smoke:dist

      # R23-QA-06: launch smoke needs WebView2 on the runner, and the release
      # path honors the same smoke depth as the ci package job.
      - name: install WebView2 (launch smoke prerequisite)
        shell: pwsh
        run: |
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          $installed = $keys | ForEach-Object { (Get-ItemProperty -ErrorAction SilentlyContinue $_).pv } | Where-Object { $_ }
          if ($installed) {
            Write-Host "WebView2 already installed: @($installed)[0]"
          } else {
            $dl = "$env:RUNNER_TEMP\webview2.exe"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $dl
            $p = Start-Process -FilePath $dl -Args "/silent /install" -PassThru -Wait
            if ($p.ExitCode -notin 0, 3010) {
              Write-Error "WebView2 installer exit code $($p.ExitCode)"
              exit $p.ExitCode
            }
            Write-Host "WebView2 installed (exit $($p.ExitCode))"
          }

      - name: app launch smoke
        shell: pwsh
        run: npm run smoke:launch

      - name: app binary smoke
        shell: pwsh
        run: npm run smoke:app

      - name: package portable zip
        shell: pwsh
        run: npm run package:portable

      - name: portable zip smoke
        shell: pwsh
        run: npm run smoke:portable

      - name: upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Remova-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: Remova-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # docs/ is no longer committed, so a curated per-release notes file cannot reach the runner.
      # The tag's own CHANGELOG section is the published text; a missing section fails the job here
      # instead of silently falling back to GitHub auto notes (which read like a raw commit list).
      - name: build Release body from CHANGELOG
        shell: pwsh
        run: pwsh -NoProfile -File scripts/extract-release-notes.ps1

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/portable/*.zip
          body_path: .release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          # a renamed/moved bundle must fail the job, not publish an asset-less Release.
          fail_on_unmatched_files: true
