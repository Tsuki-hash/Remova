name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: npm ci
        run: npm ci

      - name: check versions vs tag
        run: npm run check-versions
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --lib -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test --lib
        working-directory: src-tauri

      - name: frontend lint
        run: npm run lint

      - name: frontend typecheck tests
        run: npm run typecheck:tests

      - name: frontend tests
        run: npm test

      - name: command table vs generate_handler
        run: pwsh -NoProfile -File scripts/check-commands.ps1

      - name: tauri build
        run: npx tauri build

      - name: package portable zip
        shell: pwsh
        run: npm run package:portable

      - name: upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Remova-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: Remova-MSI
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/portable/*.zip
          generate_release_notes: true
