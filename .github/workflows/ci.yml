name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --lib -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test --lib
        working-directory: src-tauri

      - name: npm ci
        run: npm ci

      - name: frontend build
        run: npm run build
