name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# one run per ref, newest wins (PR pushes previously ran the full suite twice).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# this job only reads the repo and runs tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy (lib + tests)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test (lib + bins)
        run: cargo test --workspace
        working-directory: src-tauri

      - name: npm ci
        run: npm ci

      - name: check versions
        run: npm run check-versions

      - name: check commands
        run: npm run check-commands

      - name: frontend lint
        run: npm run lint

      - name: frontend typecheck tests
        run: npm run typecheck:tests

      - name: frontend test + coverage gate
        run: npm run coverage

      - name: frontend build
        run: npm run build

      - name: frontend dist smoke
        run: npm run smoke:dist

  package:
    runs-on: windows-latest
    timeout-minutes: 45
    # REV-QA-05: never ship artifacts from a red test tree.
    needs: test
    # Full Tauri bundle is slow — run on main and manual runs, not every PR.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: "false"
      - run: npm ci
      - run: npm run build
      - run: npx tauri build
      - name: install WebView2 (launch smoke prerequisite)
        shell: pwsh
        run: |
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          $installed = $keys | ForEach-Object { (Get-ItemProperty -ErrorAction SilentlyContinue $_).pv } | Where-Object { $_ }
          if ($installed) {
            Write-Host "WebView2 already installed: $($installed[0])"
          } else {
            $dl = "$env:RUNNER_TEMP\webview2.exe"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $dl
            $p = Start-Process -FilePath $dl -Args "/silent /install" -PassThru -Wait
            # 0 = installed, 3010 = installed (reboot pending); anything else fails the job
            if ($p.ExitCode -notin 0, 3010) {
              Write-Error "WebView2 installer exit code $($p.ExitCode)"
              exit $p.ExitCode
            }
            Write-Host "WebView2 installed (exit $($p.ExitCode))"
          }
      - name: app launch smoke
        shell: pwsh
        run: npm run smoke:launch
      - name: app binary smoke
        shell: pwsh
        run: npm run smoke:app
      - shell: pwsh
        run: npm run package:portable
      - shell: pwsh
        run: npm run smoke:portable
