name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# one run per ref, newest wins (PR pushes previously ran the full suite twice).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# this job only reads the repo and runs tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy (lib + tests)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test (lib + bins)
        run: cargo test --workspace
        working-directory: src-tauri

      - name: npm ci
        run: npm ci

      - name: check versions
        run: npm run check-versions

      - name: check commands
        run: npm run check-commands

      - name: frontend lint
        run: npm run lint

      - name: frontend typecheck tests
        run: npm run typecheck:tests

      - name: frontend test
        run: npm test

      - name: frontend build
        run: npm run build

      - name: frontend dist smoke
        run: npm run smoke:dist

  package:
    runs-on: windows-latest
    timeout-minutes: 45
    # REV-QA-05: never ship artifacts from a red test tree.
    needs: test
    # Full Tauri bundle is slow — run on main and manual runs, not every PR.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: "false"
      - run: npm ci
      - run: npm run build
      - run: npx tauri build
      - name: app binary smoke
        shell: pwsh
        run: npm run smoke:app
      - shell: pwsh
        run: npm run package:portable
      - shell: pwsh
        run: npm run smoke:portable
