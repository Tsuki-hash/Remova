name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# one run per ref, newest wins (PR pushes previously ran the full suite twice).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# this job only reads the repo and runs tests. `actions: read` lets it see the
# workflow state check below, which is what catches "Release got switched off".
permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # R-R6-07: a gate that is configured but switched off is invisible to every
      # other gate. CI and Release both sat at `disabled_manually` for weeks while
      # the README badge read "no status" and two releases shipped with no run.
      # This half of the loop is the only one that can fire: it verifies Release is
      # live. The other half (release.yml requiring a green CI run on the tag's
      # commit) catches a disabled CI.
      - name: release workflow must be enabled
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File scripts/check-workflows-enabled.ps1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.8.0
        with:
          workspaces: src-tauri

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo clippy (lib + tests)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test (lib + bins)
        run: cargo test --workspace
        working-directory: src-tauri

      - name: real registry service ImagePath read (read-only)
        shell: pwsh
        run: |
          $out = cargo test scanner::reg_scans::tests::service_image_string_reads_real_image_paths -- --ignored --exact 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0 -or -not ($out | Select-String -SimpleMatch "1 passed")) { exit 1 }
        working-directory: src-tauri

      - name: file symlink swap regression (requires runner privilege)
        shell: pwsh
        run: |
          $out = cargo test fsutil::tests::copy_dir_refuses_file_swapped_to_symlink_after_enumeration -- --ignored --exact 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0 -or -not ($out | Select-String -SimpleMatch "1 passed")) { exit 1 }
        working-directory: src-tauri

      - name: privileged seal key ACL and lost-state regression
        shell: pwsh
        run: |
          $out = cargo test path_seal::key::tests::privileged_key_store_acl_and_missing_state_regression -- --ignored --exact 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0 -or -not ($out | Select-String -SimpleMatch "1 passed")) { exit 1 }
        working-directory: src-tauri

      - name: npm ci
        run: npm ci

      - name: check versions
        run: npm run check-versions

      - name: check commands
        run: npm run check-commands

      - name: check reviews index (skips when docs/ is absent)
        run: npm run check:reviews-index

      - name: updater signature regression
        run: pwsh -NoProfile -File scripts/test-updater-signature.ps1

      - name: release signing policy regression (no build)
        run: pwsh -NoProfile -File scripts/test-release-signing-policy.ps1

      - name: frontend lint
        run: npm run lint

      - name: i18n check mode regression tests
        run: npm run test:scripts

      - name: unused i18n keys (read-only)
        run: npm run check:i18n

      - name: frontend test + coverage gate
        run: npm run coverage

      - name: frontend build
        run: npm run build

      - name: frontend dist smoke
        run: npm run smoke:dist

  package:
    runs-on: windows-latest
    timeout-minutes: 45
    # Never ship artifacts from a red test tree.
    needs: test
    # Full Tauri bundle is slow — run on main and manual runs, not every PR.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.8.0
        with:
          workspaces: src-tauri
          cache-targets: "false"
      - run: npm ci
      # The tauri build runs beforeBuildCommand (npm run build) itself.
      - run: npx tauri build
      - name: install WebView2 (launch smoke prerequisite)
        shell: pwsh
        run: |
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          $installed = $keys | ForEach-Object { (Get-ItemProperty -ErrorAction SilentlyContinue $_).pv } | Where-Object { $_ }
          if ($installed) {
            Write-Host "WebView2 already installed: @($installed)[0]"
          } else {
            $dl = "$env:RUNNER_TEMP\webview2.exe"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $dl
            $p = Start-Process -FilePath $dl -Args "/silent /install" -PassThru -Wait
            # 0 = installed, 3010 = installed (reboot pending); anything else fails the job
            if ($p.ExitCode -notin 0, 3010) {
              Write-Error "WebView2 installer exit code $($p.ExitCode)"
              exit $p.ExitCode
            }
            Write-Host "WebView2 installed (exit $($p.ExitCode))"
          }
      - name: app launch smoke
        shell: pwsh
        run: npm run smoke:launch
      - name: app binary smoke
        shell: pwsh
        run: npm run smoke:app
      - shell: pwsh
        run: npm run package:portable
      - shell: pwsh
        run: npm run smoke:portable
