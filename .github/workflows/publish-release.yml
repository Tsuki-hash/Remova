name: Publish release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag
        required: true
        type: string
      approval:
        description: Reviewed approval JSON from scripts/release-approval.ps1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-refs/tags/${{ inputs.tag }}

jobs:
  publish:
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Verify and publish the reviewed draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          APPROVAL_JSON: ${{ inputs.approval }}
          DISPATCH_ACTOR: ${{ github.triggering_actor }}
        run: pwsh -NoProfile -File scripts/publish-release-draft.ps1
