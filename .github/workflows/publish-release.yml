name: Publish release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag
        required: true
        type: string
      approval:
        description: Signed approval JSON from scripts/release-approval.ps1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-refs/tags/${{ inputs.tag }}

jobs:
  publish:
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Prepare read-only MSI extraction
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'remova-release-wix'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $archive
          $expected = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
          if ((Get-FileHash -LiteralPath $archive).Hash -ine $expected) { throw 'WiX archive checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          "RELEASE_WIX_DARK=$(Join-Path $tools 'dark.exe')" >> $env:GITHUB_ENV
      - name: Verify and publish the reviewed draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          APPROVAL_JSON: ${{ inputs.approval }}
          RELEASE_APPROVAL_PUBLIC_KEY: ${{ vars.RELEASE_APPROVAL_PUBLIC_KEY }}
          DISPATCH_ACTOR: ${{ github.triggering_actor }}
        run: pwsh -NoProfile -File scripts/publish-release-draft.ps1
