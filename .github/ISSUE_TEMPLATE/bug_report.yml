name: 缺陷反馈
description: 卸载/扫描/清理/还原等问题。请尽量填全，便于复现。
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。Remova 会删除文件，请写清**软件名 + 残留路径 + 期望行为**。
        若涉及误删，请立即停止继续清理，并说明是否还能在「更多 → 还原备份」看到会话。
  - type: input
    id: app
    attributes:
      label: 软件名称
      description: 出问题的已安装软件或残留所属软件
      placeholder: 例如：7-Zip 23.01
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: 残留 / 目标路径
      description: 相关目录、注册表项或 PATH 条目（可打码用户名）
      placeholder: 例如：C:\Program Files\7-Zip\ 或 HKLM\...\Uninstall\...
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为正确的行为是什么
      placeholder: 例如：应识别为可清理残留并允许删除 / 不应出现在残留列表
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 发生了什么？报错原文（若有）请附上
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从选择软件开始的最短路径
      placeholder: |
        1. 选中 …
        2. 深度卸载 / 强制清理 / 孤儿扫描 …
        3. …
    validations:
      required: true
  - type: dropdown
    id: flow
    attributes:
      label: 出现在哪个流程
      options:
        - 深度卸载
        - 强制清理
        - 孤儿残留
        - 安装监控
        - 启动项 / 服务 / 计划任务
        - 备份还原
        - 列表 / 估算 / 其它
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Remova 版本
      placeholder: 例如：1.1.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统
      placeholder: 例如：Windows 11 23H2 x64
    validations:
      required: false
  - type: dropdown
    id: data_loss
    attributes:
      label: 是否涉及误删或备份失败
      options:
        - 否
        - 是 — 误删了本应保留的文件
        - 是 — 备份/还原失败
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已确认不是「用户数据红线 / 共享组件被有意跳过」（1.1.1 起删除面更保守，见 Release 说明）
        - label: 未在反馈中粘贴 API Key、完整令牌或隐私文件内容
